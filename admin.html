<!DOCTYPE html>
<html lang="bn">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>BUYLAND26 - Admin Panel</title>
<style>
:root{--green:#16a34a;--green2:#15803d;--red:#dc2626;--yellow:#f59e0b;--dark:#111827;--gray:#6b7280;--border:#e5e7eb;--light:#f0fdf4;}
*{margin:0;padding:0;box-sizing:border-box;}
body{font-family:'Segoe UI',sans-serif;background:#0f172a;color:#fff;min-height:100vh;}

/* LOGIN */
.login-wrap{display:flex;align-items:center;justify-content:center;min-height:100vh;background:linear-gradient(135deg,#0f172a,#1e293b);}
.login-box{background:#1e293b;border:1px solid #334155;border-radius:20px;padding:40px;width:90%;max-width:380px;text-align:center;}
.login-logo{font-size:32px;font-weight:900;letter-spacing:3px;color:var(--green);margin-bottom:4px;}
.login-logo span{color:#fff;}
.login-tag{font-size:12px;color:var(--gray);margin-bottom:28px;}
.login-box input{width:100%;padding:12px 16px;background:#0f172a;border:2px solid #334155;border-radius:10px;color:#fff;font-size:15px;margin-bottom:14px;outline:none;}
.login-box input:focus{border-color:var(--green);}
.login-btn{width:100%;padding:13px;background:var(--green);color:#fff;border:none;border-radius:10px;font-size:16px;font-weight:700;cursor:pointer;}
.login-btn:hover{background:var(--green2);}
.login-err{color:#f87171;font-size:13px;margin-top:8px;display:none;}

/* ADMIN */
.admin{display:none;}
.topbar{background:#1e293b;border-bottom:2px solid var(--green);padding:0 20px;height:58px;display:flex;align-items:center;justify-content:space-between;position:sticky;top:0;z-index:100;}
.topbar-logo{font-size:20px;font-weight:900;color:var(--green);letter-spacing:2px;}
.topbar-logo span{color:#fff;}
.topbar-right{display:flex;align-items:center;gap:12px;}
.badge{background:var(--green);color:#fff;font-size:11px;font-weight:700;padding:3px 10px;border-radius:20px;}
.logout-btn{padding:7px 14px;background:#dc2626;color:#fff;border:none;border-radius:8px;cursor:pointer;font-size:13px;font-weight:600;}

/* STATS */
.stats-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:14px;padding:20px;}
.stat-card{background:#1e293b;border:1px solid #334155;border-radius:14px;padding:18px;text-align:center;}
.stat-card .num{font-size:32px;font-weight:800;color:var(--green);}
.stat-card .lbl{font-size:12px;color:var(--gray);margin-top:4px;}

/* TABS */
.admin-tabs{display:flex;gap:4px;background:#1e293b;padding:5px;border-radius:12px;margin:0 20px 20px;border:1px solid #334155;}
.admin-tab{flex:1;padding:9px;border-radius:8px;cursor:pointer;font-size:13px;font-weight:600;color:var(--gray);text-align:center;transition:all .2s;}
.admin-tab.active{background:var(--green);color:#fff;}

/* CARDS */
.section{padding:0 20px 30px;}
.item-card{background:#1e293b;border:1px solid #334155;border-radius:12px;padding:16px;margin-bottom:12px;}
.item-card .top{display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:8px;}
.item-card h3{font-size:15px;font-weight:700;color:#fff;}
.item-card .meta{font-size:12px;color:var(--gray);margin-bottom:6px;}
.item-card .price{font-size:16px;font-weight:800;color:var(--green);}
.item-card .desc{font-size:12px;color:#94a3b8;margin:6px 0;}
.item-card .contact{font-size:12px;color:#60a5fa;margin-bottom:10px;}
.del-btn{background:#dc2626;color:#fff;border:none;border-radius:8px;padding:7px 14px;cursor:pointer;font-size:12px;font-weight:700;}
.del-btn:hover{background:#b91c1c;}
.approve-btn{background:var(--green);color:#fff;border:none;border-radius:8px;padding:7px 14px;cursor:pointer;font-size:12px;font-weight:700;margin-right:6px;}
.img-row{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:8px;}
.img-row img{width:60px;height:60px;object-fit:cover;border-radius:6px;border:1px solid #334155;}
.empty{text-align:center;padding:40px;color:var(--gray);}
.spinner{display:flex;align-items:center;justify-content:center;padding:40px;color:var(--gray);}
.spin{width:28px;height:28px;border:3px solid #334155;border-top:3px solid var(--green);border-radius:50%;animation:spin .8s linear infinite;margin-right:10px;}
@keyframes spin{to{transform:rotate(360deg)}}

/* SEARCH */
.search-bar{margin:0 20px 16px;position:relative;}
.search-bar input{width:100%;padding:10px 16px;background:#1e293b;border:2px solid #334155;border-radius:10px;color:#fff;font-size:14px;outline:none;}
.search-bar input:focus{border-color:var(--green);}

.toast{position:fixed;bottom:20px;right:20px;background:var(--green);color:#fff;padding:12px 18px;border-radius:10px;font-size:14px;z-index:300;transform:translateY(80px);opacity:0;transition:all .3s;}
.toast.show{transform:translateY(0);opacity:1;}
.toast.error{background:var(--red);}
</style>
</head>
<body>

<!-- LOGIN -->
<div class="login-wrap" id="login-wrap">
  <div class="login-box">
    <div class="login-logo">BUY<span>LAND</span></div>
    <div class="login-tag">Admin Panel — শুধু অ্যাডমিনের জন্য</div>
    <input type="text" id="admin-user" placeholder="Username">
    <input type="password" id="admin-pass" placeholder="Password">
    <button class="login-btn" onclick="doLogin()">🔐 Login</button>
    <div class="login-err" id="login-err">❌ Username বা Password ভুল!</div>
  </div>
</div>

<!-- ADMIN PANEL -->
<div class="admin" id="admin-panel">
  <div class="topbar">
    <div class="topbar-logo">BUY<span>LAND</span></div>
    <div class="topbar-right">
      <span class="badge">🔐 Admin</span>
      <button class="logout-btn" onclick="doLogout()">Logout</button>
    </div>
  </div>

  <!-- STATS -->
  <div class="stats-grid">
    <div class="stat-card"><div class="num" id="a-listings">...</div><div class="lbl">📋 মোট তালিকা</div></div>
    <div class="stat-card"><div class="num" id="a-requests">...</div><div class="lbl">🔍 মোট চাহিদা</div></div>
    <div class="stat-card"><div class="num" id="a-offers">...</div><div class="lbl">📨 মোট অফার</div></div>
    <div class="stat-card"><div class="num" id="a-today">...</div><div class="lbl">📅 আজকের এন্ট্রি</div></div>
  </div>

  <!-- TABS -->
  <div class="admin-tabs">
    <div class="admin-tab active" onclick="showAdminTab('listings')">📋 তালিকা</div>
    <div class="admin-tab" onclick="showAdminTab('requests')">🔍 চাহিদা</div>
    <div class="admin-tab" onclick="showAdminTab('offers')">📨 অফার</div>
  </div>

  <!-- SEARCH -->
  <div class="search-bar">
    <input type="text" id="search-input" placeholder="🔍 খুঁজুন..." oninput="doSearch()">
  </div>

  <!-- LISTINGS -->
  <div class="section" id="sec-listings">
    <div class="spinner"><div class="spin"></div> লোড হচ্ছে...</div>
  </div>

  <!-- REQUESTS -->
  <div class="section" id="sec-requests" style="display:none">
    <div class="spinner"><div class="spin"></div> লোড হচ্ছে...</div>
  </div>

  <!-- OFFERS -->
  <div class="section" id="sec-offers" style="display:none">
    <div class="spinner"><div class="spin"></div> লোড হচ্ছে...</div>
  </div>
</div>

<div class="toast" id="toast"></div>

<script>
// ── CONFIG ────────────────────────────────────────────────────────────────────
const ADMIN_USER = 'buyland26';
const ADMIN_PASS = 'Buyland@2026';
const SUPA_URL   = 'https://pbrnwbfftropifpnsqgp.supabase.co';
const SUPA_KEY   = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InBicm53YmZmdHJvcGlmcG5zcWdwIiwicm9sZSI6InNlcnZpY2Vfcm9sZSIsImlhdCI6MTc3NTQ1Njg3MiwiZXhwIjoyMDkxMDMyODcyfQ.KLjXm5oy9ftDrpxJhdqMzu7ixAFCxvD-tUcvjBHmyPo';

// ── SUPABASE ──────────────────────────────────────────────────────────────────
async function sb(path, opts={}) {
  const res = await fetch(`${SUPA_URL}/rest/v1/${path}`, {
    headers:{'apikey':SUPA_KEY,'Authorization':`Bearer ${SUPA_KEY}`,'Content-Type':'application/json','Prefer':'return=representation',...opts.headers},
    ...opts
  });
  if(!res.ok){const e=await res.text();throw new Error(e);}
  return res.status===204?null:res.json();
}

// ── LOGIN ─────────────────────────────────────────────────────────────────────
function doLogin() {
  const u=document.getElementById('admin-user').value.trim();
  const p=document.getElementById('admin-pass').value.trim();
  if(u===ADMIN_USER && p===ADMIN_PASS){
    document.getElementById('login-wrap').style.display='none';
    document.getElementById('admin-panel').style.display='block';
    loadAll();
  } else {
    document.getElementById('login-err').style.display='block';
  }
}

function doLogout(){
  document.getElementById('login-wrap').style.display='flex';
  document.getElementById('admin-panel').style.display='none';
  document.getElementById('admin-user').value='';
  document.getElementById('admin-pass').value='';
}

document.addEventListener('keydown', e=>{ if(e.key==='Enter') doLogin(); });

// ── DATA ──────────────────────────────────────────────────────────────────────
let allListings=[], allRequests=[], allOffers=[];

async function loadAll() {
  try {
    const [l,r,o] = await Promise.all([
      sb('listings?order=created_at.desc'),
      sb('requests?order=created_at.desc'),
      sb('offers?order=created_at.desc')
    ]);
    allListings=l||[]; allRequests=r||[]; allOffers=o||[];
    updateStats();
    renderListings(allListings);
    renderRequests(allRequests);
    renderOffers(allOffers);
  } catch(e){ toast('ডেটা লোড হয়নি','error'); }
}

function updateStats() {
  document.getElementById('a-listings').textContent=allListings.length;
  document.getElementById('a-requests').textContent=allRequests.length;
  document.getElementById('a-offers').textContent=allOffers.length;
  const today=new Date().toDateString();
  const todayCount=[...allListings,...allRequests].filter(x=>new Date(x.created_at).toDateString()===today).length;
  document.getElementById('a-today').textContent=todayCount;
}

function timeAgo(iso){
  const d=new Date(iso),now=new Date(),diff=Math.floor((now-d)/1000);
  if(diff<60) return 'এইমাত্র';
  if(diff<3600) return Math.floor(diff/60)+'m আগে';
  if(diff<86400) return Math.floor(diff/3600)+'h আগে';
  return Math.floor(diff/86400)+'d আগে';
}

// ── RENDER LISTINGS ───────────────────────────────────────────────────────────
function renderListings(data) {
  const c=document.getElementById('sec-listings');
  if(!data.length){c.innerHTML=`<div class="empty">কোনো তালিকা নেই</div>`;return;}
  c.innerHTML=data.map(l=>`
    <div class="item-card">
      <div class="top">
        <h3>🏡 ${l.district} — ${l.area}</h3>
        <span style="font-size:11px;color:var(--gray)">${timeAgo(l.created_at)}</span>
      </div>
      <div class="meta">🏷 ${l.land_type} &nbsp;|&nbsp; 📐 ${l.size}</div>
      <div class="price">${l.price} লক্ষ</div>
      <div class="desc">${l.description||'—'}</div>
      ${l.images&&l.images.length?`<div class="img-row">${l.images.map(i=>`<img src="${i}" onclick="viewImg('${i}')">`).join('')}</div>`:''}
      <div class="contact">👤 ${l.name} &nbsp;|&nbsp; 📞 ${l.phone}${l.whatsapp?` &nbsp;|&nbsp; 💬 ${l.whatsapp}`:''}</div>
      <button class="del-btn" onclick="deleteItem('listings','${l.id}')">🗑 Delete</button>
    </div>`).join('');
}

// ── RENDER REQUESTS ───────────────────────────────────────────────────────────
function renderRequests(data) {
  const c=document.getElementById('sec-requests');
  if(!data.length){c.innerHTML=`<div class="empty">কোনো চাহিদা নেই</div>`;return;}
  c.innerHTML=data.map(r=>`
    <div class="item-card">
      <div class="top">
        <h3>🔍 ${r.district} — ${r.area}</h3>
        <span style="font-size:11px;color:var(--gray)">${timeAgo(r.created_at)}</span>
      </div>
      <div class="meta">🏷 ${r.land_type} &nbsp;|&nbsp; 📐 ${r.size||'—'}</div>
      <div class="price">💰 বাজেট: ${r.budget}</div>
      <div class="desc">${r.note||'—'}</div>
      <div class="contact">👤 ${r.name} &nbsp;|&nbsp; 📞 ${r.phone}</div>
      <button class="del-btn" onclick="deleteItem('requests','${r.id}')">🗑 Delete</button>
    </div>`).join('');
}

// ── RENDER OFFERS ─────────────────────────────────────────────────────────────
function renderOffers(data) {
  const c=document.getElementById('sec-offers');
  if(!data.length){c.innerHTML=`<div class="empty">কোনো অফার নেই</div>`;return;}
  c.innerHTML=data.map(o=>`
    <div class="item-card">
      <div class="top">
        <h3>📨 অফার</h3>
        <span style="font-size:11px;color:var(--gray)">${timeAgo(o.created_at)}</span>
      </div>
      <div class="desc">${o.description}</div>
      ${o.price?`<div class="price">${o.price} লক্ষ</div>`:''}
      <div class="contact">👤 ${o.seller_name} &nbsp;|&nbsp; 📞 ${o.seller_phone}</div>
      <button class="del-btn" onclick="deleteItem('offers','${o.id}')">🗑 Delete</button>
    </div>`).join('');
}

// ── DELETE ────────────────────────────────────────────────────────────────────
async function deleteItem(table, id) {
  if(!confirm('এটা মুছে দেবেন?')) return;
  try {
    await sb(`${table}?id=eq.${id}`,{method:'DELETE'});
    toast('✅ মুছে দেওয়া হয়েছে','success');
    await loadAll();
  } catch(e){ toast('মুছতে পারিনি','error'); }
}

// ── TABS ──────────────────────────────────────────────────────────────────────
function showAdminTab(tab) {
  ['listings','requests','offers'].forEach(t=>{
    document.getElementById('sec-'+t).style.display=t===tab?'block':'none';
  });
  document.querySelectorAll('.admin-tab').forEach((b,i)=>{
    b.className='admin-tab'+(['listings','requests','offers'][i]===tab?' active':'');
  });
}

// ── SEARCH ────────────────────────────────────────────────────────────────────
function doSearch() {
  const q=document.getElementById('search-input').value.toLowerCase();
  const fl=allListings.filter(l=>`${l.district}${l.area}${l.land_type}${l.name}${l.phone}`.toLowerCase().includes(q));
  const fr=allRequests.filter(r=>`${r.district}${r.area}${r.land_type}${r.name}${r.phone}`.toLowerCase().includes(q));
  renderListings(fl); renderRequests(fr);
}

// ── IMAGE VIEW ────────────────────────────────────────────────────────────────
function viewImg(src){window.open(src,'_blank');}

// ── TOAST ─────────────────────────────────────────────────────────────────────
let toastT;
function toast(msg,type='success'){
  const el=document.getElementById('toast');
  el.textContent=msg; el.className='toast '+type+' show';
  clearTimeout(toastT); toastT=setTimeout(()=>el.className='toast',3000);
}
</script>
</body>
</html>
